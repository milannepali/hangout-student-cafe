<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hangout Student Cafe</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Hangout Student Cafe</h1>
      <p>Find student restaurants and menus in Finland</p>
    </header>

    <main>
      <section>
        <h2>Restaurants</h2>

        <select id="city-filter">
          <option value="all">All cities</option>
        </select>

        <div id="restaurant-list"></div>
      </section>

      <section>
        <h2>Menu</h2>

        <div id="menu">
          <p>Select a restaurant to view its menu.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
